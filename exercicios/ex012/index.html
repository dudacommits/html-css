<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>videos com HTML5</title>
</head>
<body>
    <h1>inserindos videos hospedados localmente</h1>
    <p>este video esta hospedado no meu proprio servidos</p>
    <video controls width="1000" poster="imagens/SolarSystem.jpg" loop muted autoplay>
        <source src="midia/meuvideohd.mp4" type="video/mp4">
        <source src="midia/Meuvideowebm.webm" type="video/webm">
        <p>seu navegador nao tem compatibilidade com reproducao de videos.</p>
    </video>
    
    <h1>inserindo videos do youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/e1mZ2LO1vzQ?si=M-hlXGGRkgFwKgxd" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
