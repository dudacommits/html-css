<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>
        table{
            width: 400px;
            height: 100px;
            border-collapse: collapse;
         }

         thead{
            background-color: cadetblue
            ;
         }

         th{
            padding: 10px;
         }
        td,th{
            border: 1px solid black;
         }

         td{
            padding: 10px;
            text-align: center;
         }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>item</th>
                <th>valor</th>
                <th>quantidade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>diamante</td>
                <td>100</td>
                <td>1</td>
            </tr>
            <tr>
                <td>ferro</td>
                <td>10</td>
                <td>1</td>
            </tr>
        </tbody>
        <tfoot>

        </tfoot>
    </table>
    
</body>
</html>
