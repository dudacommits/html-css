<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <form action="cadastro.php">
        <p>
            <label for="iest">estado</label>
            <select name="estado" id="iest">
                <option value="">escolha um estado</option>
                <optgroup label="regiao sudeste">
                    <option value="SP">sao paulo</option>
                    <option value="RJ">rio de janeiro</option>
                    <option value="MG">minas gerais</option>
                </optgroup>

                <optgroup label="regiao nordeste">
                    <option value="RN">rio grande do norte</option>
                    <option value="PE">pernambuco</option>
                    <option value="CE">ceara</option>
                </optgroup>
            </select>
        </p>

        <p>
            <label for="iprof">profissao</label>
            <input type="text" name="prof" id="iprof" list="lstprof">
            <datalist id="lstprof">
                <option>adiministrador</option>
                <option>desenvolvedor</option>
                <option>professor</option>
            </datalist>
        </p>
    </form>
</body>
</html>
