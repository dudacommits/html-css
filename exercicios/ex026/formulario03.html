            <p>

                <input type="number" name="n2" id="in2" min="0" max="10" oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
            </p>
            <p>
                <label for="isoma">a soma e</label>
                <output id="isoma">0</output>
            </p>
