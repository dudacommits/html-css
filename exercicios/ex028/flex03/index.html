<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        *{margin: 0px; }

        main{
            width: 100vw;
            height: 100vh;
            background-color: rgb(12, 12, 146);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        div.container{
            width: 80vw;
            height: 170px;
            background-color: white;
            border-radius: 20px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-wrap: nowrap;
         }

         div.itens{
            background-color: rgb(255, 230, 2);
            border: 4px solid blue;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            font-weight: bold;
            font-size: 1.4em;
            flex-basis: 100px;
         }

        div#i1{
            flex-grow: 0;
            flex-shrink: 1;
        }

        div#i2{
            flex-grow: 2;
            flex-shrink: 0;
        }

        div#i3{
            flex-grow: 1;
            flex-shrink: 2;
        }

    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="itens" id="i1">1</div>
            <div class="itens" id="i2">2</div>
            <div class="itens" id="i3">3</div>
            
        </div>
    </main>
</body>
</html>
