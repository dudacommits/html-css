<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible box</title>
    <style>
        div.container{
            background-color: blue;
            display: flex;
            justify-content: space-evenly; /*alinhamento no eixo main-axis*/
            align-items: center; /*alinhamento no eixo cross-axis*/
            flex-flow: row wrap; 
            height: 90px;
            max-width: 1200px;
            border-radius: 15px;
        }
        div.itens{
            background-color: rgb(255, 208, 1);
            border: 2px dashed rgb(243, 117, 0);
            border-radius: 15px;
            padding: 15px;
            
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="itens">1</div>
        <div class="itens">2</div>
        <div class="itens">3</div>
        <div class="itens">4</div>
        <div class="itens">5</div>
    </div>
</body>
</html>
