<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo de hover</title>
    <style>
        body{font-family: Arial, Helvetica, sans-serif;}
        div > p {display: none; color: white; width: 130px;text-indent: 3px; padding: 20px;border-radius: 15px;}
        div:hover > p {display: block;background-color: rgba(250, 0, 84, 0.575);}
        div:hover{color: rgba(185, 6, 110, 0.404);}
    </style>
</head>
<body>
    <h1>exemplo de hover</h1>
    <p>passe o mouse sobre o paragrafo abaixo</p>
    <div>passe o mouse aqui
        <p>texto escondido...</p>
        
    </div>
    <p>fim do exemplo</p>
    <p><a href="links.html">links</a></p>
</body>
</html>
